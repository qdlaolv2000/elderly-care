<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>适老化改造 · 卫生间防滑处理预约登记</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="brand-badge">❤️ 适老化关爱工程</div>
      <h1>居家防滑处理<br>免费预约登记</h1>
      <p class="subtitle">让老人在家行走更安全、家人更放心</p>
    </header>

    <main>
      <!-- 特权福利提示卡片 -->
      <div class="benefit-banner">
        <div class="benefit-title">🎁 限时福利政策</div>
        <div class="benefit-desc">成功推荐 <strong>5位邻居好友</strong>，您本次的防滑处理服务费用 <strong>全额免除！</strong></div>
      </div>

      <!-- 极简登记卡片 -->
      <div class="card">
        <form id="registerForm" onsubmit="handleRegister(event)">
          <div class="form-group">
            <label for="userName">您的姓名 <span class="required">*</span></label>
            <input 
              type="text" 
              id="userName" 
              class="input-control" 
              placeholder="请输入您的姓名 (如: 张大爷)" 
              required 
              autocomplete="name"
            >
          </div>

          <div class="form-group">
            <label for="userPhone">手机号码 <span class="required">*</span></label>
            <input 
              type="tel" 
              id="userPhone" 
              class="input-control" 
              placeholder="请输入11位手机号码" 
              pattern="[0-9]{11}"
              maxlength="11"
              required 
              autocomplete="tel"
            >
            <div class="input-hint">💡 手机号用于预约确认和服务人员联系您</div>
          </div>

          <button type="submit" class="btn btn-primary" id="submitBtn">
            <span>📝 立即免费预约登记</span>
          </button>
        </form>
      </div>

      <!-- 微信极简提示 -->
      <div style="text-align: center; color: #64748b; font-size: 18px; margin-top: 10px;">
        <p>🔒 个人信息严格保密，仅用于防滑施工预约</p>
      </div>
    </main>

    <footer>
      <p>适老化改造服务中心 版权所有</p>
      <p style="margin-top: 10px; display: flex; justify-content: center; gap: 16px;">
        <a href="worker.html" style="color: var(--primary); font-size: 15px; font-weight: bold; text-decoration: underline;">👷 施工工人完工登记入口</a>
        <span style="color: #cbd5e1;">|</span>
        <a href="admin.html" style="color: #94a3b8; font-size: 14px; text-decoration: underline;">后台管理入口</a>
      </p>
    </footer>
  </div>

  <script src="js/supabase-config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
